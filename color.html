<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorized Historical Images</title>
    <link rel="stylesheet" href="public/css/styles.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            grid-gap: 20px;
            padding: 20px;
        }
        
        .gallery-item {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin: 0 auto;
        }
        
        .gallery-item:hover {
            transform: scale(1.03);
        }
        
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        header {
            background-color: #333;
            color: #fff;
            padding: 2rem;
            text-align: center;
        }
        
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        
        .description {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 20px;
            text-align: center;
            line-height: 1.6;
        }
        
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }

        /* Added styles for centered content and modal */
        .centered-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .thumbnail {
            cursor: pointer;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Colorized Historical Images</h1>
    </header>
    
    <div class="description">
        <p>Explore our collection of colorized historical photographs that bring the past to life with vibrant colors. These images offer a new perspective on history, allowing us to connect with the past in a more immersive way.</p>
    </div>
    
    <div class="centered-gallery">
        <div class="gallery-item">
            <img src="public/photos/color/cedar_lake.png" alt="Cedar Lake" class="thumbnail" onclick="openModal(this.src)">
        </div>
    </div>
    
    <!-- Modal for full-size image -->
    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <footer>
        <p>&copy; 2023 Colorized Historical Image Collection</p>
    </footer>

    <script>
        // Function to open the modal with full-size image
        function openModal(src) {
            const modal = document.getElementById("imageModal");
            const fullImage = document.getElementById("fullImage");
            fullImage.src = src;
            modal.style.display = "flex";
            modal.style.alignItems = "center";
            modal.style.justifyContent = "center";
        }

        // Function to close the modal
        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        // Close modal when clicking outside the image
        window.onclick = function(event) {
            const modal = document.getElementById("imageModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
